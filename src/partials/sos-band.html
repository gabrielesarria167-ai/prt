<section class="sos-band" aria-labelledby="sos-title">
  <div class="sos-band__media"><img src="img/carro-attrezzi.webp" alt="" width="1600" height="916" loading="lazy"></div>
  <div class="container sos-band__inner">
    <div>
      <h2 id="sos-title">Soccorso stradale 24/7</h2>
      <p>Incidente o auto in panne? Chiamaci a qualsiasi ora, anche di notte e nei festivi.</p>
    </div>
    <div class="sos-band__actions">
      <a class="sos-band__number" href="{{ mobile_href }}"><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>{{ mobile }}</a>
      <a class="sos-band__wa" href="{{ whatsapp_sos_href }}" target="_blank" rel="noopener"><svg class="icon" aria-hidden="true"><use href="#i-whatsapp"/></svg>oppure scrivici su WhatsApp</a>
    </div>
  </div>
</section>
