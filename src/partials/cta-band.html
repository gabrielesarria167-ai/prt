    <div class="btn-row">
      <a class="btn btn--red" href="{{ phone_href }}"><svg class="icon" aria-hidden="true"><use href="#i-phone"/></svg>Chiama</a>

      <a class="btn btn--ghost" href="{{ email_href }}"><svg class="icon" aria-hidden="true"><use href="#i-mail"/></svg>Email</a>
